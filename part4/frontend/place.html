<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB — Place details</title>
    <link rel="icon" href="images/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Sakura petals background -->
    <div id="petals-container" aria-hidden="true"></div>

    <!-- ═══ HEADER ═══ -->
    <header>
        <div class="header-container">
            <img src="images/logo.svg" alt="HBnB logo" class="logo">
            <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav>
                <a href="index.html">Home</a>
                <a href="add_place.html" id="add-place-link" style="display:none;">Add Place</a>
                <a href="profile.html" id="profile-link" style="display:none;">My Account</a>
                <!-- #login-link: required — shown/hidden by scripts.js based on auth -->
                <a href="login.html" id="login-link" class="login-button">Login</a>
                <button id="logout-btn" class="logout-button" style="display:none;" type="button">Logout</button>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌸</button>
            </nav>
        </div>
    </header>

    <main>

        <!-- Decorative hero image — src injected by scripts.js -->
        <div class="place-hero-image" aria-hidden="true">
            <img src="" alt="" loading="lazy">
        </div>

        <!-- ═══ PLACE INFO ═══                                             -->
        <!-- id="place-details": required · class="place-details": required -->
        <!-- .place-info inside is also required                             -->
        <!-- Content injected dynamically by scripts.js                      -->
        <section id="place-details" class="place-details"></section>

        <!-- ═══ REVIEWS ═══                                         -->
        <!-- id="reviews": required — .review-card injected by JS   -->
        <section id="reviews">
            <h2>Reviews</h2>
        </section>

        <!-- ═══ BOOKING REQUEST ═══ -->
        <!-- Shown to authenticated non-owners — controlled by scripts.js    -->
        <section id="booking-section" style="display:none;">
            <h2>Request a booking</h2>
            <form id="booking-form" class="form">
                <div class="form-group">
                    <label for="booking-date">Requested date</label>
                    <input type="date" id="booking-date" name="booking-date" required>
                </div>
                <button type="submit" class="details-button">Request Booking</button>
            </form>
        </section>

        <!-- ═══ ADD REVIEW ═══                                              -->
        <!-- id="add-review": required · class="add-review": required        -->
        <!-- class="form": required on the form element                       -->
        <!-- Shown only when authenticated — controlled by scripts.js         -->
        <section id="add-review" class="add-review" style="display:none;">
            <h2>Leave a review</h2>
            <form id="review-form" class="form">

                <div class="form-group">
                    <label for="review-text">Your experience</label>
                    <!-- id="review-text": required on place.html -->
                    <textarea
                        id="review-text"
                        name="review-text"
                        placeholder="Share what made your stay special…"
                        required></textarea>
                </div>

                <div class="form-group">
                    <label>Rating</label>
                    <div class="star-rating" role="radiogroup" aria-label="Rating">
                        <input type="radio" id="r5" name="inline-star" value="5">
                        <label for="r5" aria-label="5 stars — Excellent">★</label>
                        <input type="radio" id="r4" name="inline-star" value="4">
                        <label for="r4" aria-label="4 stars — Very good">★</label>
                        <input type="radio" id="r3" name="inline-star" value="3">
                        <label for="r3" aria-label="3 stars — Good">★</label>
                        <input type="radio" id="r2" name="inline-star" value="2">
                        <label for="r2" aria-label="2 stars — Fair">★</label>
                        <input type="radio" id="r1" name="inline-star" value="1">
                        <label for="r1" aria-label="1 star — Poor">★</label>
                    </div>
                    <span class="star-label-text" id="inline-star-label">&nbsp;</span>
                    <!-- hidden fallback for scripts.js compatibility -->
                    <select id="rating" name="rating" style="display:none;" aria-hidden="true"></select>
                </div>

                <!-- class="details-button": required on submit -->
                <button type="submit" class="details-button">Submit review</button>
            </form>
        </section>

    </main>

    <!-- ═══ FOOTER ═══ -->
    <footer>
        <p>&copy; 2026 HBnB. All rights reserved. · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p>
    </footer>

    <script src="petals.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
