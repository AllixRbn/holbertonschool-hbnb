<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB — Sign in</title>
    <link rel="icon" href="images/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Sakura petals background -->
    <div id="petals-container" aria-hidden="true"></div>

    <!-- ═══ HEADER ═══ -->
    <header>
        <div class="header-container">
            <img src="images/logo.svg" alt="HBnB logo" class="logo">
            <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav>
                <a href="index.html">Home</a>
                <a href="add_place.html" id="add-place-link" style="display:none;">Add Place</a>
                <a href="profile.html" id="profile-link" style="display:none;">My Account</a>
                <!-- class="login-button": required on login page nav link -->
                <a href="login.html" id="login-link" class="login-button">Login</a>
                <button id="logout-btn" class="logout-button" style="display:none;" type="button">Logout</button>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌸</button>
            </nav>
        </div>
    </header>

    <main>

        <!-- ═══ LOGIN FORM ═══                                      -->
        <!-- #login-form: required · #email: required · #password: required -->
        <!-- class="login-button" on submit: required                -->
        <section class="login-section">
            <form id="login-form" novalidate>
                <h2>Welcome back</h2>
                <p class="login-subtitle">Sign in to unlock your full HBnB experience.</p>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Your password"
                        required>
                </div>

                <!-- class="login-button": required on submit button -->
                <button type="submit" class="login-button">Sign in</button>

                <p class="form-switch">
                    No account yet? <a href="register.html">Create one</a>
                </p>
            </form>
        </section>

    </main>

    <!-- ═══ FOOTER ═══ -->
    <footer>
        <p>&copy; 2026 HBnB. All rights reserved. · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p>
    </footer>

    <script src="petals.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
