<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB — Create an account</title>
    <link rel="icon" href="images/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="petals-container" aria-hidden="true"></div>

    <!-- ═══ HEADER ═══ -->
    <header>
        <div class="header-container">
            <img src="images/logo.svg" alt="HBnB logo" class="logo">
            <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html" id="login-link" class="login-button">Login</a>
                <button id="logout-btn" class="logout-button" style="display:none;" type="button">Logout</button>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌸</button>
            </nav>
        </div>
    </header>

    <main>
        <section class="login-section">
            <form id="register-form" novalidate>
                <h2>Create account</h2>
                <p class="login-subtitle">Join HBnB and start exploring unique places to stay.</p>

                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First name</label>
                        <input
                            type="text"
                            id="first-name"
                            name="first_name"
                            autocomplete="given-name"
                            placeholder="Jane"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last name</label>
                        <input
                            type="text"
                            id="last-name"
                            name="last_name"
                            autocomplete="family-name"
                            placeholder="Doe"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="At least 6 characters"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        autocomplete="new-password"
                        placeholder="Repeat your password"
                        required>
                </div>

                <button type="submit" class="login-button">Create account</button>

                <p class="form-switch">
                    Already have an account? <a href="login.html">Sign in</a>
                </p>
            </form>
        </section>
    </main>

    <!-- ═══ FOOTER ═══ -->
    <footer>
        <p>&copy; 2024 HBnB. All rights reserved.</p>
    </footer>

    <script src="petals.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
