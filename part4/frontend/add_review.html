<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Add Review</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <img src="images/logo.png" alt="HBnB Logo" class="logo">
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html" class="login-button">Login</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="add-review">
            <h2>Add a Review</h2>
            <!-- Place title loaded dynamically -->
            <p id="place-name-display" class="reviewing-label"></p>
            <form id="review-form" class="form">
                <div class="form-group">
                    <label for="review">Your Review:</label>
                    <textarea id="review" name="review" required
                              placeholder="Share your experience..."></textarea>
                </div>
                <div class="form-group">
                    <label for="rating">Rating:</label>
                    <select id="rating" name="rating" required>
                        <option value="">Select a rating</option>
                        <option value="1">1 &#8212; Poor</option>
                        <option value="2">2 &#8212; Fair</option>
                        <option value="3">3 &#8212; Good</option>
                        <option value="4">4 &#8212; Very Good</option>
                        <option value="5">5 &#8212; Excellent</option>
                    </select>
                </div>
                <button type="submit" class="details-button">Submit Review</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
